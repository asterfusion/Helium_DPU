#
# ET3600 TC - End-to-End Transparent Clock, default IEEE 1588 profile
#
#   GM (L2 multicast, domain 0) -- X1 [ET3600 E2E TC] C2-1 -- slave
#
# The TC forwards Sync/Follow_Up/Delay_Req/Delay_Resp/Announce between its
# ports and adds the residence time to correctionField. It also syntonizes
# the shared CN103 counter to the GM, so do NOT run the BC instances
# (bc-upstream-*.cfg / bc-downstream-1588.cfg) at the same time.
#
# Usage (list every port that takes part):
#   ptp4l -f tc-e2e-1588.cfg -i X1 -i C2-1 -m
#
[global]
clock_type              E2E_TC
domainNumber            0
network_transport       L2
time_stamping           hardware
delay_mechanism         E2E
# X1 and C2-1 are different /dev nodes of the same CN103 counter
boundary_clock_jbod     1
tx_timestamp_timeout    50
summary_interval        0
logging_level           6
uds_address             /var/run/ptp4l-tc
