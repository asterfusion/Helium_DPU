#
# ET3600 BC - downstream instance (master side)
#
# Ports X2 / C1 / C2, default IEEE 1588 profile (L2 multicast, domain 0)
#
# All CN103 ports share one PTP counter (ptp0..3). The upstream instance
# (bc-upstream-g8275.2.cfg) disciplines that counter, so this instance must
# never adjust it: free_running 1, masterOnly 1.
#
# Usage (pass only the ports that are in use):
#   ptp4l -f bc-downstream-1588.cfg -i X2 -i C1 -i C2 -m
#
[global]
domainNumber            0
network_transport       L2
time_stamping           hardware
delay_mechanism         E2E
masterOnly              1
free_running            1
boundary_clock_jbod     1
priority1               128
priority2               128
clockClass              6
clockAccuracy           0x21
timeSource              0x20
logSyncInterval         0
logMinDelayReqInterval  0
logAnnounceInterval     1
tx_timestamp_timeout    50
summary_interval        0
logging_level           6
uds_address             /var/run/ptp4l-downstream
