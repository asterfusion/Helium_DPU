#
# ET3600 BC - upstream instance with two upstream ports (redundancy test)
#
#   X1   (10.25.1.2/24) <-> T-GM (10.25.1.1)
#   C1-1 (10.25.3.2/24) <-> T-GM (10.25.3.1)   via 88X6141
#
# BMCA selects one port as SLAVE, the other becomes PASSIVE / LISTENING.
# If the SLAVE port loses its link, the other port takes over.
#
# Usage:
#   ptp4l -f bc-upstream-g8275.2-x1-c1.cfg -i X1 -i C1-1 -m
#
[global]
domainNumber            2
network_transport       UDPv4
time_stamping           hardware
delay_mechanism         E2E
slaveOnly               1
# X1 (ptp1) and C1-1 (ptp4) are different /dev nodes of the same CN103 counter
boundary_clock_jbod     1
dataset_comparison      G.8275.x
G.8275.defaultDS.localPriority  128
logSyncInterval         -4
logMinDelayReqInterval  -4
# Must match the master's configured announce rate (see bc-upstream-g8275.2.cfg)
logAnnounceInterval     -3
announceReceiptTimeout  3
tx_timestamp_timeout    50
clock_servo             pi
step_threshold          0.00002
first_step_threshold    0.00002
summary_interval        0
logging_level           6
uds_address             /var/run/ptp4l-upstream
unicast_req_duration    60

[unicast_master_table]
table_id                1
logQueryInterval        2
UDPv4                   10.25.1.1

[unicast_master_table]
table_id                3
logQueryInterval        2
UDPv4                   10.25.3.1

[X1]
unicast_master_table    1

[C1-1]
unicast_master_table    3
