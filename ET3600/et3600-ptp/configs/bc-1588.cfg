#
# ET3600 BC - single instance, default IEEE 1588 profile (L2 multicast, domain 0)
#
#   GM -- X1 (upstream) [ET3600 BC] C2-1 (downstream) -- slave
#
# One ptp4l manages every port. BMCA puts the port that sees the best GM
# into SLAVE and the others into MASTER, so the GM identity / clockClass are
# passed downstream and stepsRemoved is incremented. If the upstream is lost
# the BC announces its own defaultDS (clockClass 248) downstream.
#
# Any port can be upstream or downstream; list all ports in use:
#   ptp4l -f bc-1588.cfg -i X1 -i C2-1 -m
#
# Do not run together with the TC or the two-instance BC configs.
#
[global]
domainNumber            0
network_transport       L2
time_stamping           hardware
delay_mechanism         E2E
# All CN103 ports are /dev nodes of the same counter
boundary_clock_jbod     1
priority1               128
priority2               128
tx_timestamp_timeout    50
summary_interval        0
logging_level           6
uds_address             /var/run/ptp4l-bc
