#
# ET3600 BC - upstream instance (slave side)
#
# Port C1-1 (C1 breakout, via 88X6141) <-> upstream T-GM
# Profile: ITU-T G.8275.2 style, UDPv4 unicast negotiation, domain 2
#
# C1-1 address : 10.25.3.2/24
# Master     : 10.25.3.1
# PHC        : /dev/ptp4 (shared CN103 PTP counter)
#
# Usage:
#   ptp4l -f bc-upstream-g8275.2-c1.cfg -i C1-1 -m
#
[global]
domainNumber            2
network_transport       UDPv4
time_stamping           hardware
delay_mechanism         E2E
slaveOnly               1
dataset_comparison      G.8275.x
G.8275.defaultDS.localPriority  128
logSyncInterval         -4
logMinDelayReqInterval  -4
# Must match the master's configured announce rate: the master may put its configured
# interval (-3) in the Announce header even when granting a slower rate, and
# ptp4l qualifies foreign masters using the header value (4 * 2^-3 = 0.5 s window).
logAnnounceInterval     -3
announceReceiptTimeout  3
tx_timestamp_timeout    50
clock_servo             pi
step_threshold          0.00002
first_step_threshold    0.00002
summary_interval        0
logging_level           6
uds_address             /var/run/ptp4l-upstream-c1
unicast_req_duration    60

[unicast_master_table]
table_id                1
logQueryInterval        2
UDPv4                   10.25.3.1

[C1-1]
unicast_master_table    1
